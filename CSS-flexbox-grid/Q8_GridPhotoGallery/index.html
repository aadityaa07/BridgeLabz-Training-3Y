<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grid Photo Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1 class="title">Gallery</h1>
<div class="grid-gallery">
  <figure><img src="https://via.placeholder.com/300?text=1" alt="Photo 1"><figcaption>Sunrise</figcaption></figure>
  <figure><img src="https://via.placeholder.com/300?text=2" alt="Photo 2"><figcaption>Ocean</figcaption></figure>
  <figure><img src="https://via.placeholder.com/300?text=3" alt="Photo 3"><figcaption>Valley</figcaption></figure>
  <figure><img src="https://via.placeholder.com/300?text=4" alt="Photo 4"><figcaption>Skyline</figcaption></figure>
  <figure><img src="https://via.placeholder.com/300?text=5" alt="Photo 5"><figcaption>Trail</figcaption></figure>
  <figure><img src="https://via.placeholder.com/300?text=6" alt="Photo 6"><figcaption>Waterfall</figcaption></figure>
</div>
</body>
</html>
