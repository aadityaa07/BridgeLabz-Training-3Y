<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flexbox Pricing Section</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1 class="title">Pricing Plans</h1>
<div class="pricing">
  <div class="card">
    <h2>Starter</h2>
    <p class="price">$5<span>/mo</span></p>
    <ul><li>1 Project</li><li>1 GB Storage</li></ul>
    <a href="#" class="btn">Select</a>
  </div>
  <div class="card highlighted">
    <h2>Pro</h2>
    <p class="price">$25<span>/mo</span></p>
    <ul><li>Unlimited Projects</li><li>50 GB Storage</li><li>Priority Support</li></ul>
    <a href="#" class="btn">Select</a>
  </div>
  <div class="card">
    <h2>Enterprise</h2>
    <p class="price">$60<span>/mo</span></p>
    <ul><li>Unlimited Everything</li><li>Dedicated Manager</li></ul>
    <a href="#" class="btn">Select</a>
  </div>
</div>
</body>
</html>
