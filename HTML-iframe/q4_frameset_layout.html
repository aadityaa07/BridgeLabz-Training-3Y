<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Question 4: Frameset layout using frameset and frame tags -->
    <meta charset="UTF-8">
    <title>Q4 - Frameset Layout</title>
</head>

<!-- 
    Top frame  : shows navigation links (nav.html)
    Bottom frame: shows the welcome message (welcome.html)
    Note: frameset elements only work in browsers/documents that still support 
    the old HTML frameset DOCTYPE; modern browsers may render this differently.
-->
<frameset rows="20%,80%">
    <frame src="nav.html" title="Navigation Frame">
    <frame src="welcome.html" title="Welcome Message Frame">
</frameset>

</html>
