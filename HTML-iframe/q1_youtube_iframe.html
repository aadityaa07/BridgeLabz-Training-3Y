<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Question 1: Embed a YouTube video using an iframe -->
    <meta charset="UTF-8">
    <title>Q1 - YouTube Video Embed</title>
</head>
<body>

    <h1>My Favorite YouTube Video</h1>

    <!-- 
        The width and height are set using percentage values (not pixels)
        so that the video resizes automatically when the browser window is resized.
    -->
    <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        width="80%"
        height="60%"
        title="YouTube video player">
    </iframe>

</body>
</html>
