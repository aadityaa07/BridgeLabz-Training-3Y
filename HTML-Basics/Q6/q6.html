<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blockquote Example</title>
</head>
<body>
    <!-- Meaningful quote with author cited -->
    <blockquote>
        The only way to do great work is to love what you do.
    </blockquote>
    <p>&mdash; <cite>Steve Jobs</cite></p>
</body>
</html>
