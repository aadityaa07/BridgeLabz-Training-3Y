<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Article Example</title>
</head>
<body>
    <main>
        <!-- Article with a heading and blog-style paragraph -->
        <article>
            <h2>My First Blog</h2>
            <p>Today I learned how to structure a webpage using semantic HTML tags like
               header, main, section, and article. It feels great to see a page come
               together piece by piece!</p>
        </article>
    </main>
</body>
</html>
