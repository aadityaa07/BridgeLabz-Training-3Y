<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Combined Inline Elements Example</title>
</head>
<body>
    <!-- Creative paragraph combining strong, em, mark, small, and br -->
    <p>
        <strong>Welcome</strong> to my personal webpage!<br>
        I am <em>passionate</em> about learning new things every day.<br>
        Today's <mark>featured topic</mark> is HTML basics.
        <small>Updated recently</small>
    </p>
</body>
</html>
