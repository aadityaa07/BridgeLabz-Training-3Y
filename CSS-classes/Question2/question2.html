<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="question2.css">
</head>
<body>
    <header><h1>CSS Tooltip Demonstration</h1></header>
    <main>
        <section class="tooltip-container">
            <div class="tooltip-box"><span>HTML</span><div class="tooltip">HyperText Markup Language</div></div>
            <div class="tooltip-box"><span>CSS</span><div class="tooltip">Cascading Style Sheets</div></div>
            <div class="tooltip-box"><span>Grid</span><div class="tooltip">CSS Grid Layout</div></div>
            <div class="tooltip-box"><span>Flex</span><div class="tooltip">CSS Flexbox Layout</div></div>
        </section>
    </main>
    <footer><p>Hover over each word to see the tooltip.</p></footer>
</body>
</html>
