<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="question3.css">
</head>
<body>
<header><h1>Image Showcase</h1><p>Hover over an image to see the effect.</p></header>
<main>
<section class="gallery">
<figure class="image-card"><div class="image-container"><img src="image1.svg" alt="Mountain"><div class="overlay"></div></div><figcaption>Mountain View</figcaption></figure>
<figure class="image-card"><div class="image-container"><img src="image2.svg" alt="Beach"><div class="overlay"></div></div><figcaption>Beautiful Beach</figcaption></figure>
<figure class="image-card"><div class="image-container"><img src="image3.svg" alt="Forest"><div class="overlay"></div></div><figcaption>Green Forest</figcaption></figure>
<figure class="image-card"><div class="image-container"><img src="image4.svg" alt="City"><div class="overlay"></div></div><figcaption>Modern City</figcaption></figure>
<figure class="image-card"><div class="image-container"><img src="image5.svg" alt="Desert"><div class="overlay"></div></div><figcaption>Golden Desert</figcaption></figure>
<figure class="image-card"><div class="image-container"><img src="image6.svg" alt="Lake"><div class="overlay"></div></div><figcaption>Peaceful Lake</figcaption></figure>
</section>
</main>
<footer><p>Image Showcase using HTML and CSS</p></footer>
</body>
</html>
