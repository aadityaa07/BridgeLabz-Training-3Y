<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>

  <header>
    <h1>Responsive Image Filter Gallery</h1>
    <p>Hover any image to remove its filter.</p>
  </header>

  <main>
    <section class="gallery">

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/gallery1/400/300" alt="Mountain landscape with a blur filter">
        <figcaption>Blur</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/gallery2/400/300" alt="City street in grayscale">
        <figcaption>Grayscale</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/gallery3/400/300" alt="Forest path with a sepia filter">
        <figcaption>Sepia</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/gallery4/400/300" alt="Beach scene with increased brightness">
        <figcaption>Brightness</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/gallery5/400/300" alt="Desert dunes with increased contrast">
        <figcaption>Contrast</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/gallery6/400/300" alt="Lake reflection with a hue-rotate filter">
        <figcaption>Hue-rotate</figcaption>
      </figure>

    </section>
  </main>

  <footer>
    <p>CSS Practice &middot; Responsive Image Filter Gallery</p>
  </footer>

</body>
</html>
