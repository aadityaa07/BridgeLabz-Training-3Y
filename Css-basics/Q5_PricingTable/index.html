<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pricing Table</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1 class="title">Choose Your Plan</h1>
<main class="pricing">
  <div class="plan">
    <h2>Basic</h2>
    <ul>
      <li>5 Projects</li>
      <li>2 GB Storage</li>
      <li>Email Support</li>
    </ul>
    <p class="price">$9<span>/mo</span></p>
    <a href="#" class="btn">Choose Plan</a>
  </div>

  <div class="plan popular">
    <h2>Standard</h2>
    <ul>
      <li>20 Projects</li>
      <li>10 GB Storage</li>
      <li>Priority Support</li>
    </ul>
    <p class="price">$29<span>/mo</span></p>
    <a href="#" class="btn">Choose Plan</a>
  </div>

  <div class="plan">
    <h2>Premium</h2>
    <ul>
      <li>Unlimited Projects</li>
      <li>100 GB Storage</li>
      <li>24/7 Support</li>
    </ul>
    <p class="price">$59<span>/mo</span></p>
    <a href="#" class="btn">Choose Plan</a>
  </div>
</main>
</body>
</html>
