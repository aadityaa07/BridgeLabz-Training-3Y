<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q4 — Shadows and Depth Effect Layout</title>
  <link rel="stylesheet" href="q4-shadows.css">
</head>
<body>

  <header>
    <h1>Shadows &amp; Depth</h1>
    <p>Hover a card to see it lift.</p>
  </header>

  <main>
    <div class="card-row">

      <article class="card card-soft">
        <h2>Soft Shadow</h2>
        <p>A gentle, close, low-opacity shadow — subtle elevation.</p>
      </article>

      <article class="card card-sharp">
        <h2>Sharp Shadow</h2>
        <p>A tighter, darker shadow with no blur — a crisper edge.</p>
      </article>

      <article class="card card-layered">
        <h2>Layered Shadow</h2>
        <p>Two stacked shadows combine for a richer sense of depth.</p>
      </article>

    </div>
  </main>

  <footer>
    <p>CSS Practice &middot; Question 4 of 5</p>
  </footer>

</body>
</html>
